<!DOCTYPE html>
<html>
<head>
    <title>Flask-SocketIO Test</title>
    <style>
        #chat {
            width: 300px;
            height: 400px;
            border: 1px solid #ccc;
            overflow-y: scroll;
            margin-bottom: 10px;
        }
        #message {
            width: 300px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script type="text/javascript" charset="utf-8">
        var socket
        document.addEventListener('DOMContentLoaded', (event) => {
            socket = io();
            socket.on('connect', function() {
                console.log("Connected to socket")
            });
            socket.on('message', function(msg) {
                var p = document.createElement('span');
                p.style.whiteSpace = "pre-wrap"
                p.innerHTML = msg;
                chat.appendChild(p);

                chat.scrollTop = chat.scrollHeight;
            });
            
            socket.on('dbResponse', function(msg) {
                msg.documents[0].map(x=>{
                    var p = document.createElement('p');
                    p.innerHTML = JSON.stringify(x);
                    dbResponse.appendChild(p);
                })

                dbResponse.scrollTop = dbResponse.scrollHeight;
            });
        });

        function sendMessage(){
            socket.send(message.value)
            
            var p = document.createElement('p');
            p.style.fontWeight="bold"
            p.style.fontSize="18pt"
            p.innerHTML = message.value;
            chat.appendChild(p);

            message.value=""
        }

        function sendQueryMessage(){
            dbResponse.innerHTML="";
            socket.emit("dbQuery", queryInput.value)
            
            var p = document.createElement('p');
            p.style.fontWeight="bold"
            p.style.fontSize="18pt"
            p.innerHTML = queryInput.value;
            dbResponse.appendChild(p);

            queryInput.value=""
        }
    </script>
</head>
<body>
    <h1>Chat</h1>
    <div id="chat"></div>
    <input type="text" id="message" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>
    <br/><br/><br/>
    <h1>Query DB</h1>
    <input type="text" id="queryInput" placeholder="Type a message...">
    <button onclick="sendQueryMessage()">Send</button>
    <div id="dbResponse"></div>
</body>
</html>
